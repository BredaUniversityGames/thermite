name: build

on:
  pull_request:
    branches: 'main'

env:
  VULKAN_SDK_VERSION: "1.4.328.1"

jobs:
  build:
    name: "Build ${{ matrix.preset }}"
    strategy:
      matrix:
        preset: 
          - Debug-Editor
          - Release-Editor
          - RelWithDebInfo-Editor
          - Debug-Game
          - Release-Game
          - RelWithDebInfo-Game
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\vulkan-sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}
          
      - name: Install Vulkan SDK Components
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $SDK_URL = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan-sdk.zip"
          
          # Create target directories
          New-Item -ItemType Directory -Force -Path "C:\vulkan-sdk\include"
          New-Item -ItemType Directory -Force -Path "C:\vulkan-sdk\bin"
          
          # Download and extract
          Invoke-WebRequest -Uri $SDK_URL -OutFile vulkan-sdk.zip
          Expand-Archive -Path vulkan-sdk.zip -DestinationPath .
          
          # Copy only what we need
          Copy-Item -Recurse "$env:VULKAN_SDK_VERSION\Include\vulkan" "C:\vulkan-sdk\include\"
          # if (Test-Path "$env:VULKAN_SDK_VERSION\Include\vk_video") {
          #   Copy-Item -Recurse "$env:VULKAN_SDK_VERSION\Include\vk_video" "C:\vulkan-sdk\include\"
          # }
          Copy-Item "$env:VULKAN_SDK_VERSION\Bin\slangc.exe" "C:\vulkan-sdk\bin\"
          
          # Clean up
          Remove-Item -Recurse -Force $env:VULKAN_SDK_VERSION
          Remove-Item vulkan-sdk.zip

      - name: Setup Environment
        shell: pwsh
        run: |
          echo "VULKAN_SDK=C:\vulkan-sdk" >> $env:GITHUB_ENV
          echo "C:\vulkan-sdk\bin" >> $env:GITHUB_PATH
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Configure with preset
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }}
      
      - name: Build with preset
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -j
  
  cpp-linter-windows:
    name: "Run cpp-linter (Windows)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Generate compile_commands.json
        shell: pwsh
        run: |
          cmake --preset Debug-Editor
      
      - name: Copy compile_commands.json
        shell: pwsh
        run: |
          Copy-Item "build/Debug-Editor/compile_commands.json" "compile_commands.json" -Force
      
      - name: Upload compile_commands.json (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-windows
          path: compile_commands.json
          retention-days: 7
      
      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@main
        id: linter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignore: '.github | extern | build | tests'
          style: file
          files-changed-only: true
          step-summary: true
          thread-comments: true
          tidy-checks: ''
          
  test:
    name: "Test ${{ matrix.preset }}"
    strategy:
      matrix:
        include:
          - preset: Debug-Editor
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.328.1
          vulkan-components: Vulkan-Headers
          vulkan-use-cache: true
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Configure with tests enabled
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DTHERMITE_BUILD_TESTS=ON
      
      - name: Build with tests
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -j --target UnitTests
      
      - name: Run tests
        shell: pwsh
        run: |
          ./build/${{ matrix.preset }}/bin/UnitTests
