name: build
on:
  pull_request:
    branches: 'main'
jobs:
  build:
    name: "Build ${{ matrix.preset }}"
    strategy:
      matrix:
        preset: 
          - Debug-Editor
          - Release-Editor
          - RelWithDebInfo-Editor
          - Debug-Game
          - Release-Game
          - RelWithDebInfo-Game
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: ~/vulkan-sdk
          key: vulkan-headers-slang-1.4.328.1-${{ runner.os }}-v2
          
      - name: Install Vulkan SDK Components
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: bash
        run: |
          SDK_VERSION="1.4.328.1"
          SDK_URL="https://sdk.lunarg.com/sdk/download/$SDK_VERSION/linux/vulkan-sdk.tar.xz"
          
          # Create target directories
          mkdir -p ~/vulkan-sdk/include
          mkdir -p ~/vulkan-sdk/bin
          
          # Download and extract
          wget -qO- $SDK_URL | tar -xJ
          
          # Copy only what we need
          cp -r $SDK_VERSION/x86_64/include/vulkan ~/vulkan-sdk/include/
          cp -r $SDK_VERSION/x86_64/include/vk_video ~/vulkan-sdk/include/ 2>/dev/null || true
          cp $SDK_VERSION/x86_64/bin/slangc ~/vulkan-sdk/bin/
          
          # Clean up immediately to save space
          rm -rf $SDK_VERSION
          
          # Make slangc executable
          chmod +x ~/vulkan-sdk/bin/slangc
          
      - name: Setup Environment
        shell: bash
        run: |
          echo "VULKAN_SDK=$HOME/vulkan-sdk" >> $GITHUB_ENV
          echo "$HOME/vulkan-sdk/bin" >> $GITHUB_PATH
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Configure with preset
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }}
      
      - name: Build with preset
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -j
  
  cpp-linter-windows:
    name: "Run cpp-linter (Windows)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Generate compile_commands.json
        shell: pwsh
        run: |
          cmake --preset Debug-Editor
      
      - name: Copy compile_commands.json
        shell: pwsh
        run: |
          Copy-Item "build/Debug-Editor/compile_commands.json" "compile_commands.json" -Force
      
      - name: Upload compile_commands.json (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-windows
          path: compile_commands.json
          retention-days: 7
      
      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@main
        id: linter
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignore: '.github | extern | build | tests'
          style: file
          files-changed-only: true
          step-summary: true
          thread-comments: true
          tidy-checks: ''
          
  test:
    name: "Test ${{ matrix.preset }}"
    strategy:
      matrix:
        include:
          - preset: Debug-Editor
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.328.1
          vulkan-components: Vulkan-Headers
          vulkan-use-cache: true
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Configure with tests enabled
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DTHERMITE_BUILD_TESTS=ON
      
      - name: Build with tests
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} -j --target UnitTests
      
      - name: Run tests
        shell: pwsh
        run: |
          ./build/${{ matrix.preset }}/bin/UnitTests
