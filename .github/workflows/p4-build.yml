# =============================================================================
# Release Workflow
# =============================================================================
# Generated with AI assistance
# First prompt: "how to make a release with versioning and all that is needed 
#               for pushing to a branch via CI CD github. I already have a 
#               project on main setup. I only want the github action for 
#               making a new release on push"
# Date: February 3, 2026
# Model: Claude Opus 4.5
# =============================================================================
name: release
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get latest release
        id: version
        run: |
          # Get current latest version
          CURRENT_VERSION=$(gh release view --json tagName -q .tagName)
          echo "📌 Current version: $CURRENT_VERSION"

          VERSION_NUMBER=${CURRENT_VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUMBER"

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"

          echo "🚀 New version will be: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build-editor:
    name: Build Developer-Packaging
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        run: cmake --preset Developer-Packaging -DCMAKE_UNITY_BUILD=ON -DBUILD_VERSION="${{ needs.version.outputs.new_version }}"
      - name: Build
        shell: pwsh
        run: cmake --build --preset Developer-Packaging --target game -j
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-build
          path: build/Developer-Packaging/bin/game/*

  build-game:
    name: Build Release-Game
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        run: cmake --preset Release-Game -DCMAKE_UNITY_BUILD=ON -DBUILD_VERSION="${{ needs.version.outputs.new_version }}"
      - name: Build
        shell: pwsh
        run: cmake --build --preset Release-Game --target game -j


      - name: Upload artifact (exe only, for developer zip)
        uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: build/Release-Game/bin/game/*.exe


      - name: Upload artifact (full folder, for Steam zip)
        uses: actions/upload-artifact@v4
        with:
          name: steam-build
          path: build/Release-Game/bin/game/*

  release:
    name: Create Release
    needs: [ version, build-editor, build-game ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Developer zip (unchanged behavior) ---
      - name: Download editor artifact
        uses: actions/download-artifact@v4
        with:
          name: editor-build
          path: release-package
      - name: Download game artifact
        uses: actions/download-artifact@v4
        with:
          name: game-build
          path: release-package

      # --- Steam zip (NEW): downloaded into its OWN folder so it
      # stays separate from the editor files ---
      - name: Download Steam artifact
        uses: actions/download-artifact@v4
        with:
          name: steam-build
          path: steam-package

      - name: Package builds
        run: |
          # Developer zip: editor + release exe combined
          cd release-package
          zip -r ../thermite-Developer-Packaging.zip .
          cd ..

          # Steam zip: just the Release-Game output, clean
          cd steam-package
          zip -r ../thermite-Steam.zip .
          cd ..

          # Quick sanity check in the logs
          ls -lh thermite-*.zip

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" HEAD | grep -iE "^- (feat|fix|breaking|docs|chore):" | head -20)
          else
            CHANGES=$(git log --pretty=format:"- %s" ${LATEST_TAG}..HEAD | grep -iE "^- (feat|fix|breaking|docs|chore):" | head -20)
          fi
          [ -z "$CHANGES" ] && CHANGES="- New Update just dropped!"
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          name: Release ${{ needs.version.outputs.new_version }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changes }}
          # Both zips get attached to the same release.
          files: |
            thermite-Developer-Packaging.zip
            thermite-Steam.zip
          draft: false
          prerelease: false